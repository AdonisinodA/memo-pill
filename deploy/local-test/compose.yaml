# Réplica local da produção. O nginx compartilha a rede do "server", como o
# --network host faz na VM: proxy para 127.0.0.1:3000 e IP real do cliente.
name: memo-pill-local

services:
  server:
    build:
      context: ..
      dockerfile: local-test/server.Dockerfile
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    # A VM tem IPv6 no kernel, e o memo-pill.conf escuta em [::]; o Docker
    # desliga por padrão.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0

  nginx:
    image: ${NGINX_IMAGE:-nginx:mainline-alpine}
    network_mode: service:server
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./.work/nginx:/etc/nginx/conf.d:ro
      - ./.work/letsencrypt:/etc/letsencrypt:ro
      - ./.work/certbot:/var/www/certbot:ro
    depends_on:
      - server

  # Um segundo cliente, com outro IP, para provar que o rate limit é por
  # cliente e não um balde único (o que aconteceria sem trust proxy).
  outsider:
    image: curlimages/curl
    entrypoint: ["sleep", "infinity"]
