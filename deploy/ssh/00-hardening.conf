# /etc/ssh/sshd_config.d/00-hardening.conf
# No sshd vale o PRIMEIRO valor lido de cada opção; o prefixo 00- garante que
# este arquivo vença o 50-cloud-init.conf que as imagens de nuvem trazem.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 4
X11Forwarding no
