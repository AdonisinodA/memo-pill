# Nginx de produção — o placeholder __PUBLIC_IP__ é trocado pelo setup-server.sh.
#
# Montado em /etc/nginx/conf.d do container nginx:alpine (--network host).
# Requisito de PQC: o grupo X25519MLKEM768 exige OpenSSL 3.5+, que o Debian 12
# não tem e a imagem alpine tem. Confira: docker exec nginx nginx -V

# Porta 80: só o desafio ACME (renovação do Certbot) e o redirecionamento.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__PUBLIC_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_IP__/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    # Híbrido pós-quântico primeiro; clássicos como fallback para clientes antigos.
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS, CSP e demais cabeçalhos de segurança vêm da aplicação (Helmet).
    server_tokens off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (não concatena) o que vier do cliente: o IP real é o da conexão.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
