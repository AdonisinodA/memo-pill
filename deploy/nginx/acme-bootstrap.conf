# Configuração TEMPORÁRIA, só para a primeira emissão do certificado.
# O memo-pill.conf referencia arquivos em /etc/letsencrypt que ainda não
# existem, e o `nginx -t` o recusaria. Depois da emissão, é substituída por ele.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
